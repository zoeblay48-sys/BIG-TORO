<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIG-TORO Admin Dashboard</title>
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <h1>🔒 Admin Panel</h1>
      <nav>
        <ul>
          <li><a href="#dashboard" class="nav-btn active" data-section="dashboard">Dashboard</a></li>
          <li><a href="#services" class="nav-btn" data-section="services">Manage Services</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <!-- Authentication -->
      <div id="auth-section" class="auth-section">
        <div class="auth-form">
          <h2>Admin Authentication</h2>
          <input type="password" id="admin-key" placeholder="Enter Admin Secret Key" />
          <button onclick="authenticate()">Authenticate</button>
          <p id="auth-error" class="error"></p>
        </div>
      </div>

      <!-- Dashboard Section -->
      <section id="dashboard" class="section hidden">
        <h2>Dashboard</h2>
        <div class="dashboard-stats">
          <div class="stat-card">
            <h3>Total Services</h3>
            <p id="total-services">0</p>
          </div>
          <div class="stat-card">
            <h3>Active Services</h3>
            <p id="active-services">0</p>
          </div>
        </div>
      </section>

      <!-- Services Management Section -->
      <section id="services" class="section hidden">
        <h2>Manage Services</h2>

        <!-- Add New Service Form -->
        <div class="form-container">
          <h3>Add New Service</h3>
          <form id="service-form" onsubmit="handleServiceSubmit(event)">
            <div class="form-group">
              <label for="service-name">Service Name</label>
              <input type="text" id="service-name" required />
            </div>

            <div class="form-group">
              <label for="service-desc">Description</label>
              <textarea id="service-desc" required></textarea>
            </div>

            <div class="form-group">
              <label for="service-category">Category</label>
              <select id="service-category" required>
                <option value="">Select Category</option>
                <option value="flight">Flight</option>
                <option value="hotel">Hotel</option>
                <option value="tour">Tour</option>
                <option value="activity">Activity</option>
              </select>
            </div>

            <div class="form-group">
              <label for="service-images">Image URLs (comma separated)</label>
              <input type="text" id="service-images" placeholder="https://example.com/image1.jpg, https://example.com/image2.jpg" />
            </div>

            <div class="attributes-section">
              <h4>Attributes (Custom Properties)</h4>
              <div id="attributes-container">
                <div class="attribute-input">
                  <input type="text" placeholder="Attribute Key" class="attr-key" />
                  <input type="text" placeholder="Attribute Value" class="attr-value" />
                  <button type="button" onclick="removeAttribute(this)">Remove</button>
                </div>
              </div>
              <button type="button" onclick="addAttributeField()">Add Attribute</button>
            </div>

            <div class="form-group">
              <label>
                <input type="checkbox" id="service-active" checked /> Active
              </label>
            </div>

            <button type="submit" class="btn-submit">Add Service</button>
          </form>
        </div>

        <!-- Services List -->
        <div class="services-list">
          <h3>Services List</h3>
          <table id="services-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="services-tbody">
              <!-- Services loaded dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
